name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Builds the worker and runs the offline test suite, including the
      # dist-worker API smoke tests (login -> ingest -> generate -> guide and
      # the simulation + learner-persistence round-trip). No production, no
      # network, no browser download.
      - name: Build and test
        run: npm test

      # Surface known-vulnerable dependencies without blocking the pipeline.
      # High severity and above only, production dependencies only.
      - name: Dependency audit (high severity, non-blocking)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
